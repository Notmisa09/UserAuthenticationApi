name: SBOM Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Ejecutar gate de SBOM
        shell: pwsh
        run: ./check-sbom.ps1

      - name: Adjuntar SBOM a la build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom/bom.json
          retention-days: 90

  deploy:
    needs: sbom
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Desplegando artefacto con SBOM verificado"
